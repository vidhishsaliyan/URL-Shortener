x-redirection-config: &redirection #defining an anchor
    build:
      context: .
      dockerfile: './URL Redirection Service/Dockerfile'
    image: redirection-service
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy


services:
  auth:
    build:
      context: .
      dockerfile: './auth service/Dockerfile'
    image: auth-service  
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    
  redirection1:
    <<: *redirection

  redirection2:
    <<: *redirection

  redirection3:
    <<: *redirection
  shortening:
    build:
      context: .
      dockerfile: './URL Shortening Service/Dockerfile'
    image: shortening-service
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_volume:/var/lib/postgresql/data     #this is to mount the docker volume to the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    
  url-redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis/url-redis.conf:/usr/local/etc/redis/redis.conf:ro
      - url_redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clicks-redis:
    image: redis:7
    ports:
      - "6380:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis/clicks-redis.conf:/usr/local/etc/redis/redis.conf:ro
      - clicks_redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
     

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/error_pages:/usr/share/nginx/html/error_pages:ro
    depends_on:
      redirection1:
        condition: service_healthy
      redirection2:
        condition: service_healthy
      redirection3:
          condition: service_healthy
      auth:
        condition: service_healthy
      shortening:
        condition: service_healthy
    

volumes:
  postgres_volume:                                  #this is to define the docker volume
  url_redis_volume:
  clicks_redis_volume:

