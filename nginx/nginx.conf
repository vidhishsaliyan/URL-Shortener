events{
    worker_connections 1024;
}

http{
    include /etc/nginx/mime.types;

    upstream auth_service{
        server auth:8000;
    }

    upstream redirection_service{
        server redirection:8002;
    }

    upstream shortening_service{
        server shortening:8001;
    }

    server{        

        listen 80;

	    location /api/auth/ {
            proxy_pass http://auth_service;
	    }

        location /api/urls/ {
            auth_request /auth_check;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-ID $user_id;
            proxy_pass http://shortening_service;

            error_page 401 =401 /401_error;
        }

        location = /auth_check {
            internal;
            proxy_pass http://auth_service/api/auth/auth_check;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /401_error {
            internal;
            default_type text/html;
            alias /usr/share/nginx/html/error_pages/401_error.html;
        }

        location = / {
            root /usr/share/nginx/html; 
            try_files /index.html =404;
        }

        location / {
            proxy_pass http://redirection_service;
        }
    }
}