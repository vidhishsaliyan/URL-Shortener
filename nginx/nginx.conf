events{
    worker_connections 1024;
}

http{
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=ip_limit_fast:10m rate=5r/s;
    limit_req_status 429;

    include /etc/nginx/mime.types;

    upstream auth_service{
        server auth:8000;
    }

    upstream redirection_service{
        least_conn;
        zone redirection 64k;
        server redirection1:8002 max_fails=3 fail_timeout=30s;
        server redirection2:8002 max_fails=3 fail_timeout=30s;
        server redirection3:8002 max_fails=3 fail_timeout=30s;
    }

    upstream shortening_service{
        server shortening:8001;
    }

    server{        

        listen 80;

	    location /api/auth/ {
            proxy_pass http://auth_service;

            limit_req zone=ip_limit burst=10 nodelay;
	    }

        location /api/urls/ {
            auth_request /auth_check;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-ID $user_id;
            proxy_pass http://shortening_service;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;

            limit_req zone=ip_limit burst=10 nodelay;
            error_page 401 =401 /401_error;
        }

        location = /auth_check {
            internal;
            proxy_pass http://auth_service/api/auth/auth_check;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }

        location = /401_error {
            internal;
            default_type text/html;
            alias /usr/share/nginx/html/error_pages/401_error.html;
        }

        location = / {
            root /usr/share/nginx/html; 
            try_files /index.html =404;
            limit_req zone=ip_limit_fast burst=30 nodelay;
        }

        location / {
            proxy_pass http://redirection_service;

            proxy_connect_timeout 1s;
            proxy_send_timeout 3s;
            proxy_read_timeout 2s;

            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            limit_req zone=ip_limit_fast burst=30 nodelay;
        }
    }
}