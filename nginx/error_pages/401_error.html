<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>401 Unauthorized</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        text-align: center;
        max-width: 420px;
        padding: 40px;
    }

    .code {
        font-size: 96px;
        font-weight: 700;
        color: #d93025;
        line-height: 1;
        margin-bottom: 16px;
    }

    h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    p {
        font-size: 15px;
        color: #6e6e73;
        line-height: 1.5;
        margin-bottom: 28px;
    }

    a.button {
        display: inline-block;
        background: #1d1d1f;
        color: #fff;
        text-decoration: none;
        padding: 10px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        transition: background 0.2s ease;
    }

    a.button:hover {
        background: #333;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="code">401</div>
        <h1>Unauthorized</h1>
        <p>Authentication failed. Invalid or Expired token.</p>
    </div>
</body>
</html>
